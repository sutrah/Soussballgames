name: CI

on:
  push:
  pull_request:

jobs:
  check-js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifie la syntaxe de tous les fichiers .js
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file"; then
              status=1
            fi
          done < <(find . -name '*.js' -not -path './.git/*' -print0)
          exit $status
